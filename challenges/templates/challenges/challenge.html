{% extends 'base.html' %}

{% block page_title %}
  {{ month_name|title }} Challenge
{% endblock %}

{% block content %}
  {% include 'challenges/includes/header.html' %}

  <h1>{{ month_name|title }}</h1>
  {% if text %}
    <h2>{{ text }}</h2>
  {% else %}
    <p>No challenge available for this month.</p>
  {% endif %}
{% endblock %}
